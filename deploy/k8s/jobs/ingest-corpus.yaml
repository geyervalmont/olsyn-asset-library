# Ingest the legacy corpus from the staging bucket into the library.
#
# Not part of any overlay: this runs when there is a corpus to take in, not on
# every deploy. Apply it by hand with the image tag that is live:
#
#   kubectl -n opal apply -f deploy/k8s/jobs/ingest-corpus.yaml
#   kubectl -n opal logs -f job/opal-ingest-corpus
#
# The ingest is ledgered: every file is recorded with its size, modification
# time and hash, so the job can be killed and reapplied and will pick up where
# it stopped, retrying only what failed. That is also why backoffLimit is not
# zero, unlike the migration job.
#
# Before running, the corpus must be in the staging bucket. From a machine with
# the files and the bandwidth, following the platform's rclone pattern:
#
#   rclone copy onedrive:"Material Library" s3-olsyn:olsyn-prod-material-corpus/corpus \
#     --transfers=8 --checkers=16 --s3-chunk-size=16M --s3-upload-concurrency=4 --progress
#   rclone copy ./material_assets.sqlite s3-olsyn:olsyn-prod-material-corpus/
apiVersion: batch/v1
kind: Job
metadata:
  name: opal-ingest-corpus
  namespace: opal
  labels:
    app.kubernetes.io/name: opal
    app.kubernetes.io/component: ingest
spec:
  # Resumable, so a retry costs only the files that had not landed yet.
  backoffLimit: 3
  # Kept for a day so the summary can be read after the fact.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opal
        app.kubernetes.io/component: ingest
    spec:
      restartPolicy: Never
      # The database is VPC-private and the bucket credentials come from the
      # node's instance profile, both of which only the edge node has.
      nodeSelector:
        node-role: opal
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: ingest
          image: ghcr.io/geyervalmont/olsyn-asset-library:latest
          command:
            - php
            - artisan
            - opal:import:legacy-files
            - --database=material_assets.sqlite
            - --database-disk=legacy
            - --disk=legacy
            - --prefix=corpus
          envFrom:
            - configMapRef:
                name: opal-config
            - secretRef:
                name: opal-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              # The source database is staged to disk before it is opened.
              ephemeral-storage: 4Gi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 8Gi
