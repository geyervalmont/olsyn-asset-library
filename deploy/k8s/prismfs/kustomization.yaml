apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# One drive per instance. Copy this directory (or use an overlay) per drive
# and change the slug, share name and Secret.
#
# Applied on its own, not from the production overlay: the pod is privileged
# (FUSE plus bidirectional mount propagation), its Service wants a real load
# balancer on TCP 445, and it cannot start until a drive token has been issued
# from the running control plane. See deploy/README.md.
namespace: opal

resources:
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: prismfs
      app.kubernetes.io/instance: studio-share
      app.kubernetes.io/part-of: opal

images:
  - name: prismfs
    newName: ghcr.io/geyervalmont/prismfs
    newTag: latest
  - name: prismfs-samba
    newName: ghcr.io/geyervalmont/prismfs-samba
    newTag: latest
