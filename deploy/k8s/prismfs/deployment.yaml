apiVersion: apps/v1
kind: Deployment
metadata:
  name: prismfs-studio-share
spec:
  replicas: 1
  # A FUSE mount cannot be handed over; replace the pod, don't overlap it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prismfs
      app.kubernetes.io/instance: studio-share
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prismfs
        app.kubernetes.io/instance: studio-share
    spec:
      terminationGracePeriodSeconds: 30
      volumes:
        # The FUSE mount lives here. Bidirectional propagation from the
        # prismfs container makes the mount visible to the sidecar.
        - name: prismfs-mount
          emptyDir: {}
        - name: dev-fuse
          hostPath:
            path: /dev/fuse
            type: CharDevice
        - name: samba-run
          emptyDir: {}
      containers:
        - name: prismfs
          image: prismfs
          args: ["mount"]
          envFrom:
            - configMapRef:
                name: prismfs-studio-share
            - secretRef:
                name: prismfs-studio-share
          securityContext:
            # Mounting FUSE needs SYS_ADMIN; Bidirectional mount propagation
            # additionally requires a privileged container on most runtimes.
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: prismfs-mount
              mountPath: /srv/prismfs
              mountPropagation: Bidirectional
            - name: dev-fuse
              mountPath: /dev/fuse
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          livenessProbe:
            exec:
              command: ["sh", "-c", "mountpoint -q /srv/prismfs"]
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            exec:
              command: ["sh", "-c", "mountpoint -q /srv/prismfs"]
            periodSeconds: 5
        - name: samba
          image: prismfs-samba
          # The samba image's entrypoint also mounts; here it only serves.
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until mountpoint -q "$PRISMFS_MOUNTPOINT"; do sleep 1; done
              # Authenticated share (Windows 11 requires signing; guests cannot sign).
              id -u "$PRISMFS_SMB_USER" >/dev/null 2>&1 || useradd -M -s /usr/sbin/nologin "$PRISMFS_SMB_USER"
              printf '%s\n%s\n' "$PRISMFS_SMB_PASSWORD" "$PRISMFS_SMB_PASSWORD" | smbpasswd -a -s "$PRISMFS_SMB_USER" >/dev/null
              prismfs samba-config \
                --mountpoint "$PRISMFS_MOUNTPOINT" \
                --share-name "$PRISMFS_SMB_SHARE" \
                --guest-account root \
                --user "$PRISMFS_SMB_USER" > /etc/samba/smb.conf
              testparm -s /etc/samba/smb.conf >/dev/null
              exec smbd --foreground --no-process-group --debug-stdout
          envFrom:
            - configMapRef:
                name: prismfs-studio-share
            - secretRef:
                name: prismfs-studio-share
          ports:
            - name: smb
              containerPort: 445
              protocol: TCP
          securityContext:
            capabilities:
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: prismfs-mount
              mountPath: /srv/prismfs
              mountPropagation: HostToContainer
              readOnly: true
            - name: samba-run
              mountPath: /run/samba
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "smbclient //127.0.0.1/$PRISMFS_SMB_SHARE -U \"$PRISMFS_SMB_USER%$PRISMFS_SMB_PASSWORD\" -c ls >/dev/null"]
            periodSeconds: 10
