apiVersion: v1
kind: ConfigMap
metadata:
  name: prismfs-studio-share
data:
  # Drive slug in the control plane; also the tenant id on audit events.
  PRISMFS_DRIVE_SLUG: studio-share
  PRISMFS_TENANT_ID: studio-share
  # Manifest and access-event endpoints are derived from this base URL.
  PRISMFS_MANIFEST_URL: https://opal.olsyn.com/prismfs/drives/studio-share/manifest.yaml
  PRISMFS_REFRESH_INTERVAL: "30"
  PRISMFS_AUDIT_FLUSH_INTERVAL: "5"
  PRISMFS_AUDIT_BATCH: "500"
  PRISMFS_AUDIT_OPERATIONS: read,open
  # Object store the manifest's objects live in.
  # Real S3: no endpoint override, the SDK resolves the AWS endpoint.
  AWS_DEFAULT_REGION: ap-southeast-2
  AWS_ALLOW_HTTP: "false"
  PRISMFS_S3_BUCKET: olsyn-prod-materials
  # Mount shared with the Samba sidecar.
  PRISMFS_MOUNTPOINT: /srv/prismfs
  PRISMFS_SMB_SHARE: opal
  PRISMFS_SMB_USER: opal
  PRISMFS_LOG_FORMAT: json
  RUST_LOG: prismfs=info
