# Configuration that is not secret, kept apart from the Secret so a change to
# a log level is reviewable in a diff and does not mean re-encrypting the
# database password. Both are mounted with envFrom; the Secret is listed
# second in every workload, so it wins on any key that appears in both.
apiVersion: v1
kind: ConfigMap
metadata:
  name: opal-config
  labels:
    app: opal
data:
  # Shared sign-in and centrally managed service access. These belong in data,
  # not metadata: a ConfigMap's metadata takes no arbitrary keys, so the apply
  # was rejected outright and the values never reached a pod.
  OLSYN_ACCESS_ENABLED: "true"
  OLSYN_ACCESS_URL: "https://app.olsyn.com/api/service-access/v1/opal/decision"
  OLSYN_OIDC_CLIENT_ID: "client_01M1X9GMQ01Q3A18JK1D3TS948"
  OLSYN_OIDC_ISSUER: "https://auth.olsyn.com"
  OLSYN_OIDC_REDIRECT_URI: "https://opal.olsyn.com/auth/callback"
  APP_NAME: Olsyn Asset Library
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: https://opal.olsyn.com
  APP_LOCALE: en
  APP_FALLBACK_LOCALE: en
  APP_MAINTENANCE_DRIVER: file
  BCRYPT_ROUNDS: "12"

  LOG_CHANNEL: stack
  LOG_STACK: single
  LOG_LEVEL: warning
  LOG_DEPRECATIONS_CHANNEL: "null"

  # Octane behind a TLS-terminating proxy. Without OCTANE_HTTPS the app
  # generates http:// URLs, which breaks assets, redirects and Livewire's
  # update endpoint.

  DB_CONNECTION: pgsql
  DB_HOST: olsyn-prod.c1caaoe68gcm.ap-southeast-2.rds.amazonaws.com
  DB_PORT: "5432"
  DB_DATABASE: opal
  DB_USERNAME: opal

  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: "6379"

  SESSION_DRIVER: database
  SESSION_LIFETIME: "120"
  SESSION_ENCRYPT: "false"
  SESSION_PATH: /
  SESSION_DOMAIN: opal.olsyn.com
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  BROADCAST_CONNECTION: reverb

  MAIL_MAILER: smtp
  MAIL_HOST: email-smtp.ap-southeast-2.amazonaws.com
  MAIL_PORT: "587"
  MAIL_SCHEME: tls
  MAIL_FROM_ADDRESS: asset-library@olsyn.com
  MAIL_FROM_NAME: Olsyn Asset Library

  # The library's own bucket. No access keys: pods run on the edge node, whose
  # instance profile already grants S3 on olsyn-prod-* (infra/terraform/
  # modules/edge/main.tf). AWS_URL is deliberately unset — files are served
  # through the authenticated controller, which is what records the access
  # trail, so nothing needs a public object URL.
  FILESYSTEM_DISK: s3
  MEDIA_DISK: s3
  MEDIA_MAX_FILE_SIZE: "1073741824"
  AWS_BUCKET: olsyn-prod-materials
  AWS_DEFAULT_REGION: ap-southeast-2
  AWS_USE_PATH_STYLE_ENDPOINT: "false"

  # The legacy corpus as staged for ingest: read-only, never written to by the
  # app. `opal:import:legacy-files --disk=legacy` reads from here.
  LEGACY_AWS_BUCKET: olsyn-prod-material-corpus
  LEGACY_AWS_DEFAULT_REGION: ap-southeast-2

  OPAL_FILES_DISK: s3
  # Baked into the image at a pinned commit, so a package's builder_version
  # points at something that can be rebuilt.
  OPAL_TOOLBOX_BIN: /usr/local/bin/usd-toolbox
  OPAL_FILES_PREFIX: opal/files
  OPAL_BUCKET: olsyn-prod-materials
  OPAL_AUTO_RENDER_PREVIEWS: "true"
  OPAL_SESSION_LIVE_SECONDS: "90"
  OPAL_LINK_TTL_MINUTES: "10"
  # Material metadata and approved sphere previews are embedded in Sydney by
  # Titan Multimodal, then kept in RDS pgvector for semantic and visual search.
  OPAL_EMBEDDINGS_ENABLED: "true"
  OPAL_EMBEDDINGS_PROVIDER: bedrock
  OPAL_EMBEDDINGS_MODEL: amazon.titan-embed-image-v1
  OPAL_EMBEDDINGS_DIMENSIONS: "1024"
  OPAL_EMBEDDINGS_REGION: ap-southeast-2
  OPAL_EMBEDDINGS_REQUESTS_PER_MINUTE: "60"

  # What the Reverb server binds.
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: "8080"
  # Where the application publishes events: straight to the service over the
  # cluster network, rather than out through Traefik and back. Browsers and
  # Revit clients reach Reverb on its public host instead, which they learn
  # from the baked VITE_REVERB_* values and from OPAL_REALTIME_* below.
  REVERB_HOST: opal-reverb
  REVERB_PORT: "8080"
  REVERB_SCHEME: http
  # One Reverb replica holds all connections in memory. Running more than one
  # requires REVERB_SCALING_ENABLED=true so they share state over Redis.
  REVERB_SCALING_ENABLED: "false"

  # What the Revit extension is handed when it links (config/opal.php).
  OPAL_REALTIME_SCHEME: https
  OPAL_REALTIME_HOST: opal-ws.olsyn.com
  OPAL_REALTIME_PORT: "443"
