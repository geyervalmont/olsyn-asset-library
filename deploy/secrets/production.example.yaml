# Production secrets for the Olsyn Asset Library.
#
# Copy to production.yaml, fill in, then encrypt in place:
#
#   cp deploy/secrets/production.example.yaml deploy/secrets/production.sops.yaml
#   $EDITOR deploy/secrets/production.sops.yaml
#   sops -e -i deploy/secrets/production.sops.yaml
#
# Only the encrypted *.sops.yaml is committed. Anything else ending in .yaml in
# this directory is git-ignored, so a half-finished plaintext copy cannot be
# committed by accident. CI turns the encrypted file into the opal-secrets
# Secret:
#
#   sops -d --output-type dotenv deploy/secrets/production.sops.yaml > .env.secrets
#   kubectl create secret generic opal-secrets -n olsyn-asset-library \
#     --from-env-file=.env.secrets --dry-run=client -o yaml | kubectl apply -f -
#
# Only genuinely sensitive values live here. Everything else — hostnames,
# drivers, bucket names, log levels — is in deploy/k8s/web/configmap.yaml,
# where a change is reviewable as a diff.
#
# Not here, and deliberately:
#
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
#     The pods run on the edge node, whose instance profile already grants S3
#     on olsyn-prod-*. Setting these would override that for no gain.
#
#   VITE_REVERB_APP_KEY / VITE_REVERB_HOST / VITE_REVERB_PORT / VITE_REVERB_SCHEME
#     Vite bakes these into the JavaScript at build time, so they belong to the
#     image build, not to the runtime environment. Set them as build arguments
#     in the image workflow; a value here would be ignored and the browser
#     would try to reach the development host.

# Laravel's encryption key: `php artisan key:generate --show`. Rotating it
# invalidates every session, every encrypted column and every signed URL.
APP_KEY: REPLACE_ME

# Postgres. Host, port, database and username are in the ConfigMap.
DB_PASSWORD: REPLACE_ME

# Redis, which carries the cache, the queue and Horizon's own state.
REDIS_PASSWORD: REPLACE_ME

# SMTP. Email verification is switched on, so a wrong value here means nobody
# can complete a sign-in.
MAIL_USERNAME: REPLACE_ME
MAIL_PASSWORD: REPLACE_ME

# Reverb. The id and key are handed to clients; the secret signs channel
# authorisation and must never leave the cluster. Generate all three with
# `php artisan reverb:install` locally, or any three random strings.
REVERB_APP_ID: REPLACE_ME
REVERB_APP_KEY: REPLACE_ME
REVERB_APP_SECRET: REPLACE_ME
