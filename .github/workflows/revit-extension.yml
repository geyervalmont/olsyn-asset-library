name: Revit extension
on:
  push:
    branches: [main]
    tags: ['revit/v*']
    paths: ['integrations/revit-native/**', 'apps/web/config/revit-versions.json', 'tools/extensions/**', '.github/workflows/revit-extension.yml']
  pull_request:
    paths: ['integrations/revit-native/**', 'apps/web/config/revit-versions.json', 'tools/extensions/**', '.github/workflows/revit-extension.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: revit-${{ startsWith(github.ref, 'refs/tags/') && 'release' || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Choose version
        id: version
        run: |
          $version = "0.0.0.${env:GITHUB_RUN_NUMBER}"
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            if ($env:GITHUB_REF_NAME -notmatch '^revit/v(\d+\.\d+\.\d+)$') { throw 'Use revit/vMAJOR.MINOR.PATCH' }
            $version = $Matches[1]
          }
          "value=$version" >> $env:GITHUB_OUTPUT
      - run: choco install innosetup --yes --no-progress
      - name: Test and package all Revit versions
        env:
          SIGNING_CERTIFICATE: ${{ secrets.REVIT_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.REVIT_SIGNING_CERTIFICATE_PASSWORD }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          ./integrations/revit-native/build-release.ps1 -Version $env:RELEASE_VERSION -Commit $env:GITHUB_SHA -SigningCertificateBase64 $env:SIGNING_CERTIFICATE -SigningPassword $env:SIGNING_PASSWORD
      - uses: actions/upload-artifact@v4
        with:
          name: opal-revit-${{ steps.version.outputs.value }}
          path: |
            artifacts/revit/OPAL-Revit-*
            artifacts/revit/release-manifest*.json
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/revit/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/extensions/publish.py revit artifacts/revit
