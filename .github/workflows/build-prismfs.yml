name: Build PrismFS images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: runtime
            image: prismfs
          - target: samba
            image: prismfs-samba
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./services/prismfs
          file: ./services/prismfs/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/geyervalmont/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=prismfs-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=prismfs-${{ matrix.target }}
