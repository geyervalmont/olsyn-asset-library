name: Omniverse extension
on:
  push:
    branches: [main]
    tags: ['omniverse/v*']
    paths: ['integrations/omniverse/**', 'tools/extensions/**', '.github/workflows/omniverse-extension.yml']
  pull_request:
    paths: ['integrations/omniverse/**', 'tools/extensions/**', '.github/workflows/omniverse-extension.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: omniverse-${{ startsWith(github.ref, 'refs/tags/') && 'release' || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    runs-on: ${{ vars.OPAL_LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install usd-core==25.11
      - run: python -m unittest discover -s integrations/omniverse/tests -v
      - run: python integrations/omniverse/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: opal-omniverse
          path: artifacts/omniverse/*
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/omniverse/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/extensions/publish.py omniverse artifacts/omniverse
