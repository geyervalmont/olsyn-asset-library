name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  prismfs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/prismfs
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/prismfs
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: asset_library_testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sail -d asset_library_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USERNAME: sail
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          coverage: none
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: composer install --no-interaction --prefer-dist
      - name: Generate test application key
        run: echo "APP_KEY=$(php artisan key:generate --show)" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: composer test
