name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  prismfs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/prismfs
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/prismfs
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg18-trixie
        env:
          POSTGRES_DB: asset_library_testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sail -d asset_library_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USERNAME: sail
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          coverage: none
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: composer install --no-interaction --prefer-dist
      - name: Generate test application key
        run: echo "APP_KEY=$(php artisan key:generate --show)" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: composer test

  revit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Verify the packaged client is current
        run: diff -ru --exclude='__pycache__' integrations/revit/opal_client integrations/revit/pyrevit/OPAL.extension/lib/opal_client
      - name: Test the Revit-independent client
        run: python -m unittest discover -s integrations/revit/tests -v
      - name: Assemble pyRevit extension
        run: |
          mkdir -p "$RUNNER_TEMP/opal-revit"
          cp -R integrations/revit/pyrevit/OPAL.extension "$RUNNER_TEMP/opal-revit/"
          cp integrations/revit/install_pyrevit_extension.ps1 "$RUNNER_TEMP/opal-revit/"
          cp integrations/revit/README.md "$RUNNER_TEMP/opal-revit/"
          find "$RUNNER_TEMP/opal-revit" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "$RUNNER_TEMP/opal-revit" -type f -name '*.pyc' -delete
      - uses: actions/upload-artifact@v6
        with:
          name: opal-revit-extension
          path: ${{ runner.temp }}/opal-revit
          retention-days: 30

  revit-native:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build native connector release
        env:
          SIGNING_CERTIFICATE: ${{ secrets.REVIT_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.REVIT_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          ./integrations/revit-native/build-release.ps1 `
            -Version "0.1.0.${env:GITHUB_RUN_NUMBER}" `
            -Commit "${env:GITHUB_SHA}" `
            -SigningCertificateBase64 "${env:SIGNING_CERTIFICATE}" `
            -SigningPassword "${env:SIGNING_PASSWORD}"
      - uses: actions/upload-artifact@v6
        with:
          name: opal-revit-native-${{ github.run_number }}
          path: |
            artifacts/revit/OPAL-Revit-Setup.exe
            artifacts/revit/OPAL-Revit-*-Package.zip
            artifacts/revit/release-manifest*.json
          retention-days: 30
      - name: Publish production release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "revit-latest"
          $binaries = @(
            (Get-Item artifacts/revit/OPAL-Revit-Setup.exe).FullName
            (Get-ChildItem artifacts/revit/OPAL-Revit-*-Package.zip | ForEach-Object FullName)
          )
          $manifests = @(Get-ChildItem artifacts/revit/release-manifest*.json | ForEach-Object FullName)
          $release = gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @binaries --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not upload Revit release binaries" }
            gh release upload $tag @manifests --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not publish the Revit release manifest" }
            gh release edit $tag `
              --title "OPAL for Revit 2025–2027" `
              --notes "Automatically built from ${env:GITHUB_SHA}. Download through OPAL → Settings → Revit extension." `
              --prerelease=false `
              --latest
          }
          else {
            gh release create $tag @binaries `
              --target "${env:GITHUB_SHA}" `
              --title "OPAL for Revit 2025–2027" `
              --notes "Automatically built from ${env:GITHUB_SHA}. Download through OPAL → Settings → Revit extension." `
              --latest
            if ($LASTEXITCODE -ne 0) { throw "Could not create the Revit production release" }
            gh release upload $tag @manifests --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not publish the Revit release manifest" }
          }
