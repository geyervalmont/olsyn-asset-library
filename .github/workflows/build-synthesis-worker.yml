name: Build material synthesis worker
on:
  push:
    branches: [main]
    paths: ['services/material-synthesis/**', '.github/workflows/build-synthesis-worker.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push pinned worker
        uses: docker/build-push-action@v6
        with:
          context: ./services/material-synthesis
          push: true
          tags: ghcr.io/geyervalmont/opal-material-synthesis:sha-${{ github.sha }}
          cache-from: type=gha,scope=synthesis
          cache-to: type=gha,mode=max,scope=synthesis
