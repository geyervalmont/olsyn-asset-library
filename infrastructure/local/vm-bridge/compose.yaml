# Makes the dev control plane reachable from the Windows VM on the libvirt
# bridge. Gerrymander binds the host proxy to loopback only, so this runs a
# second TLS edge on the bridge address: Caddy terminates https for the dev
# hostnames with its own local CA and proxies to the containers.
#
#   make vm-bridge-up / vm-bridge-down / vm-bridge-ca   (repo root)
#
# Port 445 (the drive) comes from services/prismfs (PRISMFS_DRIVE_BIND) and
# port 8080 (Reverb, plain ws) is published by apps/web/compose.yaml.
services:
  edge:
    image: caddy:2.10
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    ports:
      - "${VM_BRIDGE_BIND:-192.168.122.1}:80:80"
      - "${VM_BRIDGE_BIND:-192.168.122.1}:443:443"
    networks:
      - dev-proxy
    restart: unless-stopped

volumes:
  caddy-data:

networks:
  dev-proxy:
    external: true
