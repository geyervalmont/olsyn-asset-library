name: olsyn-asset-library-web

x-sail-app: &sail-app
  build:
    context: ./vendor/laravel/sail/runtimes/8.5
    dockerfile: Dockerfile
    args:
      WWWGROUP: ${WWWGROUP:-1000}
  image: olsyn-asset-library-sail:8.5
  extra_hosts:
    - host.docker.internal:host-gateway
  environment:
    WWWUSER: ${WWWUSER:-1000}
    LARAVEL_SAIL: 1
    XDEBUG_MODE: ${SAIL_XDEBUG_MODE:-off}
    XDEBUG_CONFIG: ${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}
    IGNITION_LOCAL_SITES_PATH: ${PWD}
    VITE_DEV_HOST: ${VITE_DEV_HOST:-vite.asset-library.test}
  volumes:
    - .:/var/www/html

services:
  laravel.test:
    <<: *sail-app
    networks:
      sail:
      dev-proxy:
        aliases:
          - asset-library-web
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  vite:
    <<: *sail-app
    command: ./scripts/vite.sh
    networks:
      sail:
      dev-proxy:
        aliases:
          - asset-library-vite
    depends_on:
      laravel.test:
        condition: service_started
    restart: unless-stopped

  reverb:
    <<: *sail-app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080 --debug
    networks:
      sail:
      dev-proxy:
        aliases:
          - asset-library-reverb
    ports:
      # Browsers reach Reverb as wss://ws.asset-library.test through Gerrymander;
      # LAN clients (the Revit VM on the libvirt bridge) connect to 8080 directly.
      - "127.0.0.1:8080:8080"
      - "${OPAL_REALTIME_HOST:-192.168.122.1}:8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  queue:
    <<: *sail-app
    command: php artisan horizon
    networks:
      sail:
      dev-proxy:
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  pgsql:
    image: pgvector/pgvector:0.8.1-pg18-trixie
    environment:
      PGPASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_DATABASE:-asset_library}
      POSTGRES_USER: ${DB_USERNAME:-sail}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - sail-pgsql:/var/lib/postgresql
      - ./vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql
    networks:
      - sail
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE:-asset_library}", "-U", "${DB_USERNAME:-sail}"]
      interval: 5s
      retries: 10
      timeout: 5s

  redis:
    image: redis:8-alpine
    volumes:
      - sail-redis:/data
    networks:
      - sail
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
      timeout: 5s

  mailpit:
    image: axllent/mailpit:v1.27
    networks:
      sail:
      dev-proxy:
        aliases:
          - asset-library-mailpit

networks:
  sail:
    driver: bridge
  dev-proxy:
    external: true

volumes:
  sail-pgsql:
    driver: local
  sail-redis:
    driver: local
